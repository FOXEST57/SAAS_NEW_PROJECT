<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Klimafact — Devis &amp; Facturation CVC</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gestion de devis et factures pour la vente de climatisation et de chauffage."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash de couleur.
      (function () {
        try {
          var t = localStorage.getItem('kf-theme');
          var dark =
            t === 'dark' ||
            (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
